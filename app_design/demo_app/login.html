<script>
tailwind.config = {

        <a href="kepsek-laporan.html" class="text-center text-xs font-medium px-3 py-2 rounded-md bg-role-kepsek/10 text-role-kepsek border border-role-kepsek/20 hover:bg-role-kepsek/20">Kepala Sekolah</a>
        <a href="guru-forum.html" class="text-center text-xs font-medium px-3 py-2 rounded-md bg-role-guru/10 text-role-guru border border-role-guru/20 hover:bg-role-guru/20 col-span-2">Guru</a>
